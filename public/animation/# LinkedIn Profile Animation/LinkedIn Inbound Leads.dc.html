    }
    const k = loop / 12;
    const ins = [1.0 * k, 2.7 * k, 4.4 * k];
    const outs = [10.3 * k, 10.6 * k, 10.9 * k];
    const inDur = 0.85 * k, outDur = 0.7 * k;
    for (let i = 0; i < 3; i++) {
      const el = this['toast' + i + 'Ref'].current;
      if (!el) continue;
      let o, y, sc;
      if (tt < ins[i]) { o = 0; y = 16; sc = 0.985; }
      else if (tt < ins[i] + inDur) { const e = this.ease((tt - ins[i]) / inDur); o = e; y = 16 * (1 - e); sc = 0.985 + 0.015 * e; }
      else if (tt < outs[i]) { o = 1; y = 0; sc = 1; }
      else if (tt < outs[i] + outDur) { const e = this.ease((tt - outs[i]) / outDur); o = 1 - e; y = -6 * e; sc = 1 - 0.01 * e; }
      else { o = 0; y = 16; sc = 0.985; }
      el.style.opacity = o.toFixed(3);
      el.style.transform = 'translateY(' + y.toFixed(2) + 'px) scale(' + sc.toFixed(4) + ')';
      const dot = this['dot' + i + 'Ref'].current;
      if (dot) {
        const pk = 0.5 - 0.5 * Math.cos(tt / (loop / 4) * Math.PI * 2);
        dot.style.transform = 'scale(' + (1 + 0.35 * pk).toFixed(3) + ')';
        dot.style.opacity = (1 - 0.25 * pk).toFixed(3);
      }
    }
  }
  loopLen() { return this.props.loopSeconds ?? 12; }
  applyVars() {
    const el = this.rootRef.current;
    if (!el) return;
    el.style.setProperty('--accent', this.props.accentColor ?? '#0028FA');
    el.style.setProperty('--loop', (this.props.loopSeconds ?? 12) + 's');
    el.style.background = this.props.backdropColor ?? '#EDEAE2';
    document.body.style.background = this.props.backdropColor ?? '#EDEAE2';
  }
  componentDidMount() {
    this.applyVars();
    this.fit();
    window.addEventListener('resize', this.fit);
    requestAnimationFrame(this.fit);
    if (this.exportRef.current) {
      this.exportRef.current.setAttribute('data-om-exportable-video-with-duration-secs', String(this.loopLen()));
      this.exportRef.current.addEventListener('data-om-seek-to-time-frame', this.onSeek);
    }
    this._raf = requestAnimationFrame(this.tick);
  }
  componentDidUpdate() {
    this.applyVars();
    this.fit();
    if (this.exportRef.current) this.exportRef.current.setAttribute('data-om-exportable-video-with-duration-secs', String(this.loopLen()));
  }
  componentWillUnmount() {
    window.removeEventListener('resize', this.fit);
    cancelAnimationFrame(this._raf);
    if (this.exportRef.current) this.exportRef.current.removeEventListener('data-om-seek-to-time-frame', this.onSeek);
  }
  renderVals() {
    const v = { rootRef: this.rootRef, stageRef: this.stageRef, exportRef: this.exportRef, winRef: this.winRef };
    for (let i = 0; i < 3; i++) { v['toast' + i + 'Ref'] = this['toast' + i + 'Ref']; v['dot' + i + 'Ref'] = this['dot' + i + 'Ref']; }
    return v;
  }
}
</script>
</body>
</html>
