<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<script>window.OM_SCENES = '[{"name":"Position","dur":1.7,"desc":"The card settles and the dot appears at Position with a soft breath"},{"name":"Travel","dur":2.3,"desc":"The dot travels along the rising path, drawing a blue trail behind it"},{"name":"Prime","dur":1.1,"desc":"The dot pauses at Prime and the chip lights up"},{"name":"Launch","dur":2.6,"desc":"The dot climbs to Launch, where a soft blue ripple bursts out"},{"name":"Climb","dur":2.8,"desc":"Momentum continues: the line and dot climb on toward Sustain"},{"name":"Sustain","dur":2.6,"desc":"Holds at the top with the dashed continuation, then fades out to loop"}]';</script>
<script>window.OM_PLAYBACK = '{"mode":"loop"}';</script>
<script>/*EDITMODE-BEGIN*/window.TWEAK_DEFAULTS = {"motionEditor": true};/*EDITMODE-END*/</script>
<style>
  html, body { margin: 0; padding: 0; background: #EEF0E5; }
  a { color: #0028FA; text-decoration: none; }
  a:hover { color: #0020C8; }
</style>
</helmet>
<x-import component-from-global-scope="GTMStage" from="./animations-v3.jsx ./gtm-motif.jsx" accent="{{ accent }}" path-thickness="{{ pathThickness }}" show-beyond="{{ showBeyond }}" hint-size="100%,100%" style="position:absolute;inset:0"></x-import>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#0028FA&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#0028FA&quot;,&quot;#0B0B0C&quot;,&quot;#0020C8&quot;]},&quot;pathThickness&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:4,&quot;min&quot;:2,&quot;max&quot;:8,&quot;step&quot;:0.5,&quot;unit&quot;:&quot;px&quot;,&quot;tsType&quot;:&quot;number&quot;},&quot;showBeyond&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    return {
      accent: this.props.accent ?? '#0028FA',
      pathThickness: this.props.pathThickness ?? 4,
      showBeyond: this.props.showBeyond ?? true,
    };
  }
}
</script>
</body>
</html>
