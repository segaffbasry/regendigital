    const cyc = this.cycleRef.current;
    this.cycle2Ref.current.innerHTML = cyc.innerHTML;
    this.measure();
    this.liked = null;
    this.pressed = null;
    this.focused = null;
    this.t0 = performance.now();
    this.paused = false;
    this.raf = requestAnimationFrame(this.frame);
    this.fit();
    this.onResize = () => { this.fit(); this.measure(); };
    window.addEventListener('resize', this.onResize);

    this.likeBtns = Array.from(vp.querySelectorAll('[data-likebtn]'));
    this.rings = Array.from(vp.querySelectorAll('[data-ring]'));
    this.counts = Array.from(vp.querySelectorAll('[data-count]'));
    this.ctas = Array.from(vp.querySelectorAll('[data-cta]'));

    if (t >= tPress && t < tPress + 0.42) {
      const u = (t - tPress) / 0.42;
      cs = u < 0.28 ? 1 - 0.038 * (u / 0.28) : 1 - 0.038 * (1 - (u - 0.28) / 0.72) * (1 - Math.pow((u - 0.28) / 0.72, 2));
    }
    this.ctas.forEach(c => { c.style.transform = 'scale(' + cs.toFixed(3) + ')'; });
  };
}
</script>
