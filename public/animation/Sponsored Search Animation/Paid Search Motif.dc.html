<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  html, body { margin: 0; padding: 0; background: #EEF0E5; }
  a { color: #0028FA; text-decoration: none; }
  a:hover { color: #0020C8; }
</style>
<script>window.OM_SCENES = '[{"name":"Type","dur":1.9,"desc":"The query types itself into the search bar letter by letter"},{"name":"Organic","dur":1.2,"desc":"Four greeked organic results fade and rise into the list"},{"name":"Sponsored","dur":1.4,"desc":"The Sponsored result slides in and settles above everything else"},{"name":"Click","dur":1.9,"desc":"A blue cursor drifts over the paid result and presses it, with a soft ripple"},{"name":"Reset","dur":1.5,"desc":"Everything fades gently back to an empty search bar for the loop"}]';</script>
<script>window.OM_PLAYBACK = '{"mode":"loop"}';</script>
</helmet>
<div style="width: 100%; min-height: 100vh; background: #EEF0E5; display: flex; align-items: center; justify-content: center;">
  <x-import component-from-global-scope="SerpMotif" from="./animations-v3.jsx ./serp-motif.jsx" accent="{{ accent }}" hint-size="100%,800px" style="width: 100%;">
  </x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#0028FA&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#0028FA&quot;,&quot;#111111&quot;,&quot;#0020C8&quot;],&quot;section&quot;:&quot;Look&quot;},&quot;motionEditor&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Editing&quot;}}">
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#0028FA' };
  }
}
</script>
</body>
</html>
