<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:800},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#0028FA&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#0028FA&quot;,&quot;#0B0B0B&quot;,&quot;#3D5AFE&quot;,&quot;#0F62FE&quot;],&quot;section&quot;:&quot;Look&quot;},&quot;background&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#EEF0E5&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#EEF0E5&quot;,&quot;#F6F4EE&quot;,&quot;#FFFFFF&quot;,&quot;transparent&quot;],&quot;section&quot;:&quot;Look&quot;},&quot;loopSeconds&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:15,&quot;min&quot;:8,&quot;max&quot;:26,&quot;step&quot;:1,&quot;unit&quot;:&quot;s&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Motion&quot;},&quot;showCaptionBars&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Look&quot;}}">
class Component extends DCLogic {
  renderVals() {
    return {
      setRoot: (el) => {
        if (!el) return;
        if (!el.__fitObserver) {
          const fit = () => {
            const host = el.parentElement;
            if (!host) return;
            const scale = Math.min(host.clientWidth / 1200, host.clientHeight / 800);
            el.style.transform = 'translate(-50%,-50%) scale(' + Math.max(.05, scale) + ')';
          };
          el.__fitObserver = new ResizeObserver(fit);
          el.__fitObserver.observe(el.parentElement);
          window.addEventListener('resize', fit);
          fit();
        }
        const p = this.props || {};
        if (p.accent) el.style.setProperty('--accent', p.accent);
        if (p.loopSeconds) {
          el.style.setProperty('--loop', p.loopSeconds + 's');
          el.setAttribute('data-om-exportable-video-with-duration-secs', String(p.loopSeconds));
        }
        if (!el.__seekWired) {
          el.__seekWired = true;
          el.addEventListener('data-om-seek-to-time-frame', (e) => {
            const t = ((e.detail && e.detail.time) || 0) * 1000;
            el.getAnimations({ subtree: true }).forEach(a => {
              try { a.pause(); a.currentTime = t; } catch (err) {}
            });
            clearTimeout(el.__resumeT);
            el.__resumeT = setTimeout(() => {
              el.getAnimations({ subtree: true }).forEach(a => { try { a.play(); } catch (err) {} });
            }, 1200);
          });
        }
        if (p.background) el.style.background = p.background;
        const hide = p.showCaptionBars === false;
        el.querySelectorAll('[data-bars]').forEach(b => { b.style.display = hide ? 'none' : 'flex'; });
      }
    };
  }
}
