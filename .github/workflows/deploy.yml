# Deploys the site to Vercel on every push to main.
#
# Deployments are authenticated with VERCEL_TOKEN, which belongs to the Vercel
# account that owns the project. Vercel therefore sees the account deploying to
# itself and never inspects who authored the commit -- so anyone with push
# access can ship, regardless of which email their git identity uses.
#
# This is why the Vercel project must NOT be connected to the repository in the
# Vercel dashboard. If it were, each push would also trigger Vercel's own Git
# integration, which does check commit authorship and blocks non-members.

name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "Deployed to $url"
          echo "### Deployed :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "$url" >> $GITHUB_STEP_SUMMARY
